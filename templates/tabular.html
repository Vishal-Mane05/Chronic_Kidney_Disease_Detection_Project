<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinical Prediction - CKD Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --blue: #1a73e8;
            --blue-dark: #0d47a1;
            --blue-light: #e8f0fe;
            --purple: #7c3aed;
            --purple-light: #f0ebff;
            --green: #059669;
            --red: #dc2626;
            --red-light: #fef2f2;
            --orange: #c2410c;
            --orange-light: #fff7ed;
            --bg: #f0f4f8;
            --text: #1e293b;
            --muted: #64748b;
            --card-shadow: 0 10px 40px rgba(13, 71, 161, 0.08);
        }
        
        * { box-sizing: border-box; }
        body { background: var(--bg); font-family: 'Sora', sans-serif; color: var(--text); margin: 0; overflow-x: hidden; }

        /* --- NAVBAR --- */
        .navbar { 
            background: rgba(255, 255, 255, 0.9); 
            backdrop-filter: blur(12px); 
            padding: 16px 0; 
            border-bottom: 1px solid rgba(0,0,0,0.05); 
            position: sticky; top: 0; z-index: 100;
        }
        .navbar-brand { font-weight: 800; font-size: 1.4rem; color: var(--blue) !important; letter-spacing: -0.5px; text-transform: uppercase; }
        
        .nav-btn {
            background-color: var(--blue-light);
            color: var(--blue-dark);
            border-radius: 50px;
            padding: 8px 24px;
            font-weight: 700;
            font-size: 0.9rem;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .nav-btn:hover { background-color: #dbeafe; color: var(--blue-dark); transform: translateY(-2px); }

        /* --- HERO SECTION --- */
        .page-hero { 
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            padding: 70px 0 140px; 
            color: white; 
            text-align: center;
            position: relative;
        }
        .page-hero::before {
            content: ''; position: absolute; inset: 0;
            background: radial-gradient(circle at 15% 50%, rgba(255,255,255,0.04) 0%, transparent 55%),
                        radial-gradient(circle at 85% 20%, rgba(255,255,255,0.04) 0%, transparent 45%);
        }
        .page-hero h1 { font-size: 2.8rem; font-weight: 800; letter-spacing: -1px; margin-bottom: 15px; position: relative;}
        .page-hero p { opacity: 0.8; font-size: 1.1rem; position: relative;}

        /* --- WIZARD CARD --- */
        .wizard-container { margin-top: -90px; position: relative; z-index: 10; padding-bottom: 80px; max-width: 950px; margin-left: auto; margin-right: auto;}
        .wizard-card { 
            background: white; border-radius: 24px; padding: 50px; 
            box-shadow: var(--card-shadow); border: 1px solid rgba(0,0,0,0.04); 
        }

        /* --- WIZARD PROGRESS --- */
        .wizard-progress { display: flex; justify-content: space-between; margin-bottom: 45px; position: relative; padding: 0 40px; }
        .wizard-progress::before { content: ''; position: absolute; top: 50%; left: 50px; right: 50px; height: 4px; background: #e2e8f0; z-index: 1; transform: translateY(-50%); border-radius: 4px;}
        .progress-bar-fill { position: absolute; top: 50%; left: 50px; height: 4px; background: var(--blue); z-index: 2; transform: translateY(-50%); transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1); border-radius: 4px; }
        
        .step-circle { 
            width: 44px; height: 44px; border-radius: 50%; background: white; color: var(--muted); 
            font-weight: 700; display: flex; align-items: center; justify-content: center; 
            z-index: 3; border: 4px solid #e2e8f0; transition: all 0.4s ease; font-size: 1rem;
        }
        .step-circle.active { background: var(--blue); color: white; border-color: var(--blue-light); box-shadow: 0 0 0 6px rgba(26, 115, 232, 0.1); }
        .step-circle.completed { background: var(--green); color: white; border-color: var(--green-light); }

        /* --- FORM ELEMENTS --- */
        .wizard-step { display: none; animation: slideUp 0.4s ease forwards; opacity: 0; transform: translateY(15px); }
        .wizard-step.active { display: block; }
        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
        
        .step-header { display: flex; align-items: center; gap: 15px; margin-bottom: 35px; }
        .step-icon { width: 50px; height: 50px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; flex-shrink: 0; }
        .step-title { font-weight: 800; color: var(--text); font-size: 1.5rem; margin: 0; }
        
        .form-label { font-weight: 700; color: var(--muted); font-size: 0.75rem; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-control, .form-select { 
            border-radius: 14px; border: 2px solid transparent; padding: 14px 18px; 
            background: var(--bg); color: var(--text); font-weight: 600; font-family: 'Sora', sans-serif;
            transition: all 0.2s; box-shadow: none; font-size: 0.95rem;
        }
        .form-control:focus, .form-select:focus { 
            border-color: var(--blue); background: white; 
            box-shadow: 0 4px 15px rgba(26, 115, 232, 0.08); outline: none;
        }

        /* --- BUTTONS --- */
        .btn-wizard { padding: 14px 36px; font-weight: 700; border-radius: 50px; transition: all 0.3s; font-size: 1rem; border: none; display: inline-flex; align-items: center; gap: 10px; font-family: 'Sora', sans-serif;}
        .btn-primary-custom { background: var(--blue); color: white; box-shadow: 0 8px 20px rgba(26, 115, 232, 0.25); }
        .btn-primary-custom:hover { background: var(--blue-dark); transform: translateY(-3px); color: white; box-shadow: 0 12px 25px rgba(26, 115, 232, 0.35);}
        
        .btn-outline { background: white; color: var(--muted); border: 2px solid #e2e8f0; }
        .btn-outline:hover { background: var(--bg); color: var(--text); border-color: #cbd5e1; transform: translateY(-2px); }

        .dev-tools-box { background: var(--blue-light); border-radius: 16px; padding: 20px 24px; border: 1px dashed rgba(26, 115, 232, 0.3); }

        /* --- LOADER --- */
        #loading-screen { position: fixed; inset: 0; background: rgba(255,255,255,0.9); display: none; justify-content: center; align-items: center; z-index: 9999; flex-direction: column; backdrop-filter: blur(8px);}
        .spinner { width: 60px; height: 60px; border: 5px solid var(--blue-light); border-top: 5px solid var(--blue); border-radius: 50%; animation: spin 1s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        @media (max-width: 768px) { .wizard-card { padding: 30px 20px; } .wizard-progress { padding: 0 10px; } }
    </style>
</head>
<body>

<div id="loading-screen">
    <div class="spinner mb-4"></div>
    <h3 class="fw-bold" style="color: var(--blue-dark);">Analyzing Clinical Data...</h3>
    <p style="color: var(--muted); font-size: 1.1rem;">Applying Random Forest Diagnostic Model</p>
</div>

<nav class="navbar navbar-expand-lg">
    <div class="container-fluid px-lg-5">
        <a class="navbar-brand" href="/">
            <i class="fas fa-kidneys me-2"></i>CKD PREDICTOR
        </a>
        <div>
            <a href="javascript:history.back()" class="nav-btn"><i class="fas fa-arrow-left me-2"></i>Cancel & Return</a>
        </div>
    </div>
</nav>

<div class="page-hero">
    <div class="container">
        <h1><i class="fas fa-clipboard-list me-3 text-primary"></i>Clinical Assessment</h1>
        <p>Please enter the patient's lab results carefully to generate an AI rationale.</p>
    </div>
</div>

<div class="container-fluid px-3">
    <div class="wizard-container">
        <div class="wizard-card">
            
            <div class="wizard-progress">
                <div class="progress-bar-fill" id="progressFill" style="width: 0%;"></div>
                <div class="step-circle active" id="indicator1">1</div>
                <div class="step-circle" id="indicator2">2</div>
                <div class="step-circle" id="indicator3">3</div>
            </div>

            <form id="clinicalForm" action="/predict/tabular" method="POST">
                {% if patient_id %}
                <input type="hidden" name="patient_id" value="{{ patient_id }}">
                {% endif %}

                <div class="wizard-step active" id="step1">
                    <div class="step-header">
                        <div class="step-icon" style="background: var(--blue-light); color: var(--blue);"><i class="fas fa-user-clock"></i></div>
                        <h4 class="step-title">Vitals & History</h4>
                    </div>
                    
                    <div class="row g-4">
                        <div class="col-md-4">
                            <label class="form-label">Age (Years)</label>
                            <input type="number" name="age" class="form-control" placeholder="e.g., 45" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Blood Pressure (mm/Hg)</label>
                            <input type="number" name="bloodpressure" class="form-control" placeholder="e.g., 80">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Appetite</label>
                            <select name="appetite" class="form-select">
                                <option value="good">Good</option>
                                <option value="poor">Poor</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Hypertension</label>
                            <select name="hypertension" class="form-select">
                                <option value="no">No</option>
                                <option value="yes">Yes</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Diabetes Mellitus</label>
                            <select name="diabetesmellitus" class="form-select">
                                <option value="no">No</option>
                                <option value="yes">Yes</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Coronary Disease</label>
                            <select name="coronaryarterydisease" class="form-select">
                                <option value="no">No</option>
                                <option value="yes">Yes</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Anemia</label>
                            <select name="anemia" class="form-select">
                                <option value="no">No</option>
                                <option value="yes">Yes</option>
                            </select>
                        </div>
                    </div>
                    <div class="d-flex justify-content-end mt-5 pt-4 border-top">
                        <button type="button" class="btn-wizard btn-primary-custom" onclick="nextStep(1)">Next Step <i class="fas fa-arrow-right"></i></button>
                    </div>
                </div>

                <div class="wizard-step" id="step2">
                    <div class="step-header">
                        <div class="step-icon" style="background: var(--red-light); color: var(--red);"><i class="fas fa-vial"></i></div>
                        <h4 class="step-title">Blood Panel</h4>
                    </div>

                    <div class="row g-4">
                        <div class="col-md-4">
                            <label class="form-label">Blood Glucose Random</label>
                            <input type="number" name="bloodglucoserandom" class="form-control" placeholder="e.g., 120">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Blood Urea</label>
                            <input type="number" name="bloodurea" class="form-control" placeholder="e.g., 30">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Serum Creatinine</label>
                            <input type="number" step="0.1" name="serumcreatinine" class="form-control" placeholder="e.g., 1.2">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Sodium (mEq/L)</label>
                            <input type="number" name="sodium" class="form-control" placeholder="e.g., 135">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Potassium (mEq/L)</label>
                            <input type="number" step="0.1" name="potassium" class="form-control" placeholder="e.g., 4.5">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Hemoglobin (gms)</label>
                            <input type="number" step="0.1" name="hemoglobin" class="form-control" placeholder="e.g., 15.0">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">WBC Count</label>
                            <input type="number" name="wbccount" class="form-control" placeholder="e.g., 8000">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">RBC Count</label>
                            <input type="number" step="0.1" name="rbccount" class="form-control" placeholder="e.g., 5.2">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">PCV</label>
                            <input type="number" name="packedellvolume" class="form-control" placeholder="e.g., 44">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Red Blood Cells</label>
                            <select name="redbloodcells" class="form-select">
                                <option value="normal">Normal</option>
                                <option value="abnormal">Abnormal</option>
                            </select>
                        </div>
                    </div>
                    <div class="d-flex justify-content-between mt-5 pt-4 border-top">
                        <button type="button" class="btn-wizard btn-outline" onclick="prevStep(2)"><i class="fas fa-arrow-left"></i> Back</button>
                        <button type="button" class="btn-wizard btn-primary-custom" onclick="nextStep(2)">Next Step <i class="fas fa-arrow-right"></i></button>
                    </div>
                </div>

                <div class="wizard-step" id="step3">
                    <div class="step-header">
                        <div class="step-icon" style="background: var(--orange-light); color: var(--orange);"><i class="fas fa-flask"></i></div>
                        <h4 class="step-title">Urinalysis</h4>
                    </div>

                    <div class="row g-4">
                        <div class="col-md-4">
                            <label class="form-label">Specific Gravity</label>
                            <input type="number" step="0.001" name="specificgravity" class="form-control" placeholder="e.g., 1.020">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Albumin (0-5)</label>
                            <input type="number" name="albumin" class="form-control" placeholder="Select 0-5">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Sugar (0-5)</label>
                            <input type="number" name="sugar" class="form-control" placeholder="Select 0-5">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Pus Cells</label>
                            <select name="puscells" class="form-select">
                                <option value="normal">Normal</option>
                                <option value="abnormal">Abnormal</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Pus Cell Clumps</label>
                            <select name="puscellsclumps" class="form-select">
                                <option value="notpresent">Not Present</option>
                                <option value="present">Present</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Bacteria</label>
                            <select name="bacteriapresence" class="form-select">
                                <option value="notpresent">Not Present</option>
                                <option value="present">Present</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Pedal Edema</label>
                            <select name="pedaledema" class="form-select">
                                <option value="no">No</option>
                                <option value="yes">Yes</option>
                            </select>
                        </div>
                    </div>

                    <div class="dev-tools-box mt-5 d-flex align-items-center justify-content-between flex-wrap gap-3">
                        <span class="small fw-bold text-uppercase" style="color: var(--blue-dark); letter-spacing: 0.5px;"><i class="fas fa-code me-2"></i>Dev Tools</span>
                        <div class="d-flex gap-2">
                            <button type="button" class="btn btn-sm btn-outline-success fw-bold px-3 rounded-pill" onclick="fillCKD()">Auto-Fill Healthy</button>
                            <button type="button" class="btn btn-sm btn-outline-danger fw-bold px-3 rounded-pill" onclick="fillNormal()">Auto-Fill CKD</button>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between mt-5 pt-4 border-top">
                        <button type="button" class="btn-wizard btn-outline" onclick="prevStep(3)"><i class="fas fa-arrow-left"></i> Back</button>
                        <button type="submit" class="btn-wizard btn-primary-custom" style="background: var(--green); box-shadow: 0 8px 20px rgba(5, 150, 105, 0.25);"><i class="fas fa-brain"></i> Analyze Data</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
<script>
    function updateProgress(step) {
        let fillWidth = step === 1 ? '0%' : step === 2 ? '50%' : '100%';
        document.getElementById('progressFill').style.width = fillWidth;
        for(let i=1; i<=3; i++) {
            let indicator = document.getElementById('indicator' + i);
            if(i < step) { 
                indicator.className = 'step-circle completed'; 
                indicator.innerHTML = '<i class="fas fa-check"></i>'; 
            } else if(i === step) { 
                indicator.className = 'step-circle active'; 
                indicator.innerHTML = i; 
            } else { 
                indicator.className = 'step-circle'; 
                indicator.innerHTML = i; 
            }
        }
    }
    
    function nextStep(current) {
        document.getElementById('step' + current).classList.remove('active');
        document.getElementById('step' + (current + 1)).classList.add('active');
        updateProgress(current + 1);
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    
    function prevStep(current) {
        document.getElementById('step' + current).classList.remove('active');
        document.getElementById('step' + (current - 1)).classList.add('active');
        updateProgress(current - 1);
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
</script>
</body>
</html>
